name: Essais

on:
  push:
  pull_request:

jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bibliothèques en cache (marked, DOMPurify, highlight.js, mermaid)
        uses: actions/cache@v4
        with:
          path: outils/.cache
          key: bibliotheques-${{ hashFiles('js/*.js', 'outils/essai.js') }}
          restore-keys: bibliotheques-
      - name: Installer Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Essai de bout en bout
        run: node outils/essai.js
