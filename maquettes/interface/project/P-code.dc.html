<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu — code coloré et mermaid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212}
a{color:#f0b45a}a:hover{color:#f5c77f}
</style>
</helmet>
<div style="width: 760px; height: 900px; box-sizing: border-box; background: #121212; color: #e6e6e6; font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.7; overflow: hidden;">
  <h1 style="margin: 0; font-size: 22px; font-weight: 800;">Synchronisation</h1>
  <p style="margin: 0;">Le client enregistre une seconde après la dernière frappe :</p>

  <figure style="margin: 0; border: 1px solid #2a2d33; border-radius: 6px; background: #0c0d0f; overflow: hidden;">
    <figcaption style="display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; border-bottom: 1px solid #2a2d33; font-size: 11px; color: #9aa0a8;">
      <span>js</span>
      <button type="button" style="height: 28px; padding: 0 10px; border: 1px solid #2a2d33; border-radius: 4px; background: transparent; color: #9aa0a8; font: inherit; font-size: 11px;">copier</button>
    </figcaption>
    <pre style="margin: 0; padding: 12px 14px; font-family: inherit; font-size: 13px; line-height: 1.65; color: #e6e6e6; white-space: pre;"><span style="color: #6f747c; font-style: italic;">// une seule sauvegarde à la fois</span>
<span style="color: #f0b45a;">async function</span> <span style="color: #8fb8d6;">sauvegarder</span>(id, champs) {
  <span style="color: #f0b45a;">const</span> { data, error } = <span style="color: #f0b45a;">await</span> client
    .<span style="color: #8fb8d6;">from</span>(<span style="color: #a5c98f;">'notes'</span>)
    .<span style="color: #8fb8d6;">update</span>(champs).<span style="color: #8fb8d6;">eq</span>(<span style="color: #a5c98f;">'id'</span>, id);
  <span style="color: #f0b45a;">if</span> (error) <span style="color: #8fb8d6;">setTimeout</span>(sauvegarder, <span style="color: #e39b7b;">5000</span>);
}</pre>
  </figure>

  <figure style="margin: 0; border: 1px solid #2a2d33; border-radius: 6px; background: #0c0d0f; overflow: hidden;">
    <figcaption style="display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; border-bottom: 1px solid #2a2d33; font-size: 11px; color: #9aa0a8;">
      <span>sql</span>
      <button type="button" style="height: 28px; padding: 0 10px; border: 1px solid #2a2d33; border-radius: 4px; background: transparent; color: #9aa0a8; font: inherit; font-size: 11px;">copier</button>
    </figcaption>
    <pre style="margin: 0; padding: 12px 14px; font-family: inherit; font-size: 13px; line-height: 1.65; color: #e6e6e6; white-space: pre;"><span style="color: #f0b45a;">create policy</span> <span style="color: #a5c98f;">"own notes"</span> <span style="color: #f0b45a;">on</span> notes
  <span style="color: #f0b45a;">for all using</span> (user_id = <span style="color: #8fb8d6;">auth.uid</span>());</pre>
  </figure>

  <p style="margin: 4px 0 0;">Le chemin d'une note :</p>
  <figure style="margin: 0; padding: 20px 16px; border: 1px solid #2a2d33; border-radius: 6px; background: #121212; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <svg width="660" height="200" viewBox="0 0 660 200" role="img" aria-label="Diagramme mermaid : frappe, attente d'une seconde, envoi à Supabase, enregistré ou nouvel essai">
      <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0a8"/></marker></defs>
      <g font-family="JetBrains Mono, monospace" font-size="13" fill="#e6e6e6" text-anchor="middle">
        <rect x="10" y="70" width="110" height="44" rx="6" fill="#1b1d21" stroke="#5b5f66"/><text x="65" y="97">frappe</text>
        <rect x="170" y="70" width="130" height="44" rx="6" fill="#1b1d21" stroke="#5b5f66"/><text x="235" y="97">attente 1 s</text>
        <rect x="350" y="70" width="130" height="44" rx="6" fill="#1b1d21" stroke="#f0b45a" stroke-width="1.5"/><text x="415" y="97" fill="#f0b45a">supabase</text>
        <rect x="530" y="20" width="120" height="44" rx="6" fill="#1b1d21" stroke="#5b5f66"/><text x="590" y="47">● enregistré</text>
        <rect x="530" y="130" width="120" height="44" rx="6" fill="#1b1d21" stroke="#5b5f66"/><text x="590" y="157">réessai 5 s</text>
      </g>
      <g stroke="#9aa0a8" stroke-width="1.4" fill="none" marker-end="url(#fl)">
        <path d="M120 92 H168"/><path d="M300 92 H348"/>
        <path d="M480 85 C505 85 505 42 528 42"/><path d="M480 99 C505 99 505 152 528 152"/>
        <path d="M590 174 V190 H415 V116" stroke-dasharray="4 4"/>
      </g>
      <g font-family="JetBrains Mono, monospace" font-size="11" fill="#9aa0a8">
        <text x="498" y="58">ok</text><text x="492" y="140">erreur</text>
      </g>
    </svg>
    <figcaption style="font-size: 11px; color: #6f747c;">mermaid · flowchart LR</figcaption>
  </figure>

  <div style="display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #9aa0a8;">
    <span><span style="color: #f0b45a;">■</span> mots-clés</span>
    <span><span style="color: #8fb8d6;">■</span> fonctions</span>
    <span><span style="color: #a5c98f;">■</span> chaînes</span>
    <span><span style="color: #e39b7b;">■</span> nombres</span>
    <span><span style="color: #6f747c;">■</span> commentaires</span>
  </div>
</div>
</x-dc>

return {};
}

</body>
</html>
